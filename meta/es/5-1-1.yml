REC_USE_LIM: >-
  Documentació metodològica sobre la 5 Onada del Baròmetre d'Opinió Ciutadana: [Baròmetre Onada 5](https://www.valencia.es/estadistica/Barometro/Metodologia5.pdf).
  
   
  
  Les entrevistes que es van recollir per a la informació del Baròmetre es van realitzar entre Juny i Juliol de 2018, publicant-se el Baròmetre el mes de setembre. Encara que els resultats es publiquen per a l'any 2018, les respostes comprenen l'interval Juny/Juliol 2018 - Juny/Juliol 2018. Es va entrevistar un total de 2301 persones empadronades a la ciutat de València.
  
  Documentació metodològica sobre la 23 Onada del Baròmetre d'Opinió Ciutadana: [Baròmetre Onada 23](https://www.valencia.es/estadistica/Barometro/Metodologia23.pdf).
  
  Les entrevistes que es van recollir per a la informació del Baròmetre es van realitzar en desembre de 2023, publicant-se el Baròmetre el mes de març de 2024. Es va entrevistar un total de 2356 persones empadronades a la ciutat de València.
DATA_COMP: >-
  Quocient del nombre de dones que declaren haver patit discriminació per motius de sexe en els últims dotze mesos abans de l'enquesta entre el total de dones enquestades que responen a la pregunta.
